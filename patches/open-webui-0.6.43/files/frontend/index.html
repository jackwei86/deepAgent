		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

		// DeepAgent: 侧边栏"工作空间"后注入 素材库/工具说明 入口(升级 open-webui 后需重打, 见 docs)
		(function () {
			function inject() {
				var sb = document.getElementById('sidebar');
				if (!sb) return false;
				if (document.getElementById('deepagent-entry-wrap')) return true;
				var wrap = document.createElement('div');
				wrap.id = 'deepagent-entry-wrap';
				wrap.style.cssText = 'width:100%;margin:4px 0;padding:4px 4px 4px;border-top:1px solid rgba(128,140,160,.3);';
				function mk(href, text) {
					var a = document.createElement('a');
					a.href = href; a.textContent = text;
					a.style.cssText = 'display:flex;align-items:center;gap:8px;margin:2px 6px;padding:8px 10px;'

						+ 'background:rgba(128,140,160,.12);cursor:pointer;';
					a.onmouseenter = function () { a.style.background = 'rgba(128,140,160,.24)'; };
					a.onmouseleave = function () { a.style.background = 'rgba(128,140,160,.12)'; };
					wrap.appendChild(a);
				}
				mk('/media-ui/?v=20260914', '🖼️ 素材库');
				mk('/media-ui/?v=20260914&docs=1', '🛠️ 工具说明');
				// 定位"工作空间"项(兼容英文界面 Workspace), 插到它所在行之后; 找不到则放末尾
				// 首选: 用链接地址定位(工作空间导航项 href="/workspace")
				var anchor = sb.querySelector('a[href^="/workspace"]');
				if (!anchor) {
					// 兜底: 文本包含匹配
					var nodes = sb.querySelectorAll('a, button, div, span');
					for (var i = 0; i < nodes.length; i++) {
						var txt = (nodes[i].textContent || '');
						if (txt.indexOf('工作空间') !== -1 || txt.indexOf('Workspace') !== -1) {
							anchor = nodes[i].closest ? (nodes[i].closest('a,button') || nodes[i]) : nodes[i];
							break;
						}
					}
				}
				if (anchor) {
					// 若工作空间行处于横向 flex 容器中, 向上找到非行容器, 保证入口换行显示在其下方
					var spot = anchor;
					while (spot.parentElement && spot.parentElement !== sb) {
						var cs = getComputedStyle(spot.parentElement);
						if (cs.display.indexOf('flex') === -1 || cs.flexDirection.indexOf('row') !== -1) { }
						if (cs.display.indexOf('flex') !== -1 && cs.flexDirection.indexOf('row') !== -1) {
							spot = spot.parentElement;
						} else {
							break;
						}
					}
					spot.insertAdjacentElement('afterend', wrap);
				} else {
					sb.appendChild(wrap);
				}
				return true;
			}
			var mo = new MutationObserver(function () { inject(); });
			mo.observe(document.body, { childList: true, subtree: true });
			inject();
		})();
