<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>DeepAgent 素材库与工具说明</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2430'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<script>
/* 主题跟随聊天页(同源共享 localStorage 的 theme 设置) */
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  var dark = t === 'dark' || t === 'oled' ||
    ((t === 'system' || !t) && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
  :root, html[data-theme="light"] {
    --bg: #f4f4f5; --side: #f9fafb; --text: #1a1a1e; --muted: #6b7280;
    --card: #ffffff; --border: #e5e7eb; --hover: #f3f4f6; --accent: #3b82f6;
  }
  html[data-theme="dark"] {
    --bg: #09090b; --side: #131316; --text: #e5e7eb; --muted: #9ca3af;
    --card: #1a1a1e; --border: rgba(255,255,255,.08); --hover: rgba(255,255,255,.06);
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 280px; background: var(--side); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border); }
  .sidebar h1 { font-size: 15px; padding: 14px 16px; color: var(--text); border-bottom: 1px solid var(--border); }
  .tree-wrap { flex: 1; overflow-y: auto; padding: 10px 6px; }
  .tree-dir { margin: 2px 0; }
  .tree-label { padding: 5px 8px; cursor: pointer; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--text); }
  .tree-label:hover { background: var(--hover); }
  .tree-children { margin-left: 16px; }
  .tree-file { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; border-radius: 6px; font-size: 12.5px; color: var(--muted); }
  .tree-file:hover { background: var(--hover); color: var(--text); }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { padding: 10px 18px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar .title { font-size: 15px; font-weight: 600; margin-right: auto; }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; margin: 2px; text-decoration: none; }
  .btn:hover { opacity: .88; }
  .btn.gray { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn.gray:hover { background: var(--hover); }
  .content { flex: 1; overflow-y: auto; padding: 18px; }
  .content.drag { outline: 2px dashed var(--accent); outline-offset: -10px; }
  .drop-hint { border: 2px dashed var(--border); border-radius: 10px; padding: 10px; text-align: center; font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card .thumb { height: 120px; background: var(--hover); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .thumb .icon { font-size: 34px; }
  .card .meta { padding: 8px 10px; font-size: 12px; }
  .card .meta .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .card .meta .ops { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card .meta .ops a, .card .meta .ops button { font-size: 11.5px; color: var(--accent); text-decoration: none; background: none; border: none; cursor: pointer; padding: 0; }
  .card .meta .ops button.del { color: #ef6b64; }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 14px; }
  .doc h3 { margin: 18px 0 6px; font-size: 16px; }
  .doc p { font-size: 13.5px; color: var(--text); opacity: .92; margin: 6px 0; line-height: 1.7; }
  .doc table { border-collapse: collapse; width: 100%; margin: 8px 0 18px; background: var(--card); font-size: 13px; }
  .doc th, .doc td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  .doc th { background: var(--hover); }
  .doc code { background: var(--hover); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.78); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  #lightbox img, #lightbox video { max-width: 92%; max-height: 92%; border-radius: 8px; }
  .toast { position: fixed; top: 16px; right: 16px; background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; z-index: 60; }
  .toast.show { opacity: .96; }
</style>
</head>
<body>
  <div class="sidebar">
    <h1>📚 DeepAgent 素材库</h1>
    <div class="tree-wrap" id="tree"></div>
  </div>
  <main>
    <div class="toolbar">
      <button class="btn gray" onclick="goBack()" title="返回之前的页面">← 返回</button>
      <div class="title" id="viewTitle">素材库</div>
      <button class="btn" onclick="document.getElementById('fileInput').click()">＋ 添加素材</button>
      <button class="btn gray" onclick="loadTaskOutputs()">任务产物导入</button>
      <button class="btn gray" onclick="loadTree()">刷新</button>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" hidden>
    <div class="content" id="content"><div class="empty">加载中…</div></div>
  </main>
  <div id="lightbox" onclick="this.style.display='none'"></div>
  <div class="toast" id="toast"></div>

<script>
const API = '/media/api';
const TOKEN = localStorage.getItem('token') || '';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
async function api(path, options = {}) {
  const resp = await fetch(API + path, {
    ...options,
    headers: { Authorization: 'Bearer ' + TOKEN, ...(options.headers || {}) },
  });
  if (resp.status === 401) { document.getElementById('content').innerHTML =
    '<div class="empty">未检测到登录态：请先在 <a href="/" target="_self">聊天首页</a> 登录后刷新本页。</div>';
    throw new Error('unauthorized'); }
  if (!resp.ok) throw new Error((await resp.text()).slice(0, 200));
  return resp.json();
}

function switchView(view) {
  document.getElementById('tree').style.display = view === 'media' ? '' : 'none';
  if (view === 'docs') loadDocs();
  else loadTree();
}

async function loadTree() {
  const tree = await api('/tree');
  const el = document.getElementById('tree');
  el.innerHTML = '';
  el.appendChild(renderDir(tree, true));
  viewAll(tree);
}
function renderDir(node, isRoot) {
  const wrap = document.createElement('div');
  wrap.className = 'tree-dir';
  const label = document.createElement('div');
  label.className = 'tree-label';
  label.innerHTML = (isRoot ? '👤 ' : (node.name === 'image' ? '🖼️ ' : node.name === 'video' ? '🎬 ' : '📁 ')) + node.name;
  label.onclick = () => viewAll(node);
  wrap.appendChild(label);
  const kids = document.createElement('div');
  kids.className = 'tree-children';
  (node.children || []).forEach(child => {
    if (child.type === 'dir') kids.appendChild(renderDir(child, false));
    else {
      const f = document.createElement('div');
      f.className = 'tree-file';
      f.innerHTML = (child.kind === 'image' ? '🖼️' : '🎬') + ` <span>${child.name}</span><span style="margin-left:auto;font-size:11px;color:var(--muted)">${fmt(child.size)}</span>`;
      f.onclick = () => preview(child.rel_path, child.kind === 'image');
      kids.appendChild(f);
    }
  });
  wrap.appendChild(kids);
  return wrap;
}

let ALL_FILES = [];
function viewAll(node) {
  document.getElementById('viewTitle').textContent = '素材库：' + node.name;
  ALL_FILES = [];
  collect(node);
  renderGrid(ALL_FILES);
}
function collect(node) {
  (node.children || []).forEach(c => { if (c.type === 'dir') collect(c); else ALL_FILES.push(c); });
}
function renderGrid(files) {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="drop-hint">将本地图片/视频拖入本页面任意位置，或点上方「＋ 添加素材」上传（自动分类到 image / video）</div>'
    + (files.length ? '<div class="grid"></div>' : '<div class="empty">暂无素材</div>');
  const grid = c.querySelector('.grid');
  files.forEach(f => grid.appendChild(card(f)));
  bindDrop(c);
}
function card(f) {
  const div = document.createElement('div');
  div.className = 'card';
  const url = `${API}/download?path=${encodeURIComponent(f.rel_path)}`;
  const thumb = f.kind === 'image'
    ? `<img src="${url}" loading="lazy" onclick="preview('${encodeURIComponent(f.rel_path)}', true)">`
    : `<div class="icon" onclick="preview('${encodeURIComponent(f.rel_path)}', false)">🎬</div>`;
  div.innerHTML = `<div class="thumb">${thumb}</div>
    <div class="meta"><div class="name" title="${f.name}">${f.name}</div>
    <div class="ops"><a href="${url}" download>下载</a><button class="del" onclick="delFile('${encodeURIComponent(f.rel_path)}')">删除</button></div></div>`;
  return div;
}
function preview(rel, isImage) {
  const lb = document.getElementById('lightbox');
  const url = `${API}/download?path=${rel}`;
  lb.innerHTML = isImage ? `<img src="${url}">` : `<video src="${url}" controls autoplay></video>`;
  lb.style.display = 'flex';
}
async function delFile(rel) {
  if (!confirm('确定删除该素材？')) return;
  await api('/file?path=' + rel, { method: 'DELETE' });
  toast('已删除'); loadTree();
}

document.getElementById('fileInput').onchange = e => uploadFiles(e.target.files);
const content = document.getElementById('content');
content.addEventListener('dragover', e => { e.preventDefault(); content.classList.add('drag'); });
content.addEventListener('dragleave', () => content.classList.remove('drag'));
content.addEventListener('drop', e => {
  e.preventDefault(); content.classList.remove('drag');
  if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});
async function uploadFiles(fileList) {
  if (!fileList || !fileList.length) return;
  const fd = new FormData();
  [...fileList].forEach(f => fd.append('files', f));
  const r = await api('/upload', { method: 'POST', body: fd });
  toast(`已导入 ${r.saved.length} 个${r.rejected.length ? `，跳过 ${r.rejected.length} 个不支持的类型` : ''}`);
  loadTree();
}

async function loadTaskOutputs() {
  const outputs = await api('/task-outputs');
  document.getElementById('viewTitle').textContent = '任务产物 → 导入素材库 / 查看处理链';
  const c = document.getElementById('content');
  if (!outputs.length) { c.innerHTML = '<div class="empty">暂无任务产物</div>'; return; }
  c.innerHTML = '<div class="grid"></div>';
  const grid = c.querySelector('.grid');
  outputs.forEach(o => {
    const kind = o.name.match(/\.(jpe?g|png|bmp|webp|gif)$/i) ? 'image' : 'video';
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<div class="thumb"><div class="icon">${kind === 'image' ? '🖼️' : '🎬'}</div></div>
      <div class="meta"><div class="name" title="${o.task_id}">${o.name}</div>
      <div style="color:var(--muted)">${o.task_id}${o.pipeline_id ? ` · 🔗链 ${o.pipeline_id}` : ''}</div>
      <div class="ops">
        <button onclick="importTask('${o.path.replace(/\\/g, '\\\\')}')">导入素材库</button>
        <button onclick="showChain('${o.task_id}')">处理链</button>
        <button onclick="importAndContinue('${o.path.replace(/\\/g, '\\\\')}', '${o.name}')">导入并继续处理</button>
      </div></div>`;
    grid.appendChild(div);
  });
}
async function importTask(path) {
  const r = await api('/import-task', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
  toast('已导入素材库：' + r.rel_path); loadTree();
}
async function importAndContinue(path, name) {
  await importTask(path);
  toast(`已导入素材库：${name}。到聊天页说 "处理素材库里的 ${name} ..." 即可从该结果继续处理`);
}
async function showChain(taskId) {
  const chain = await api('/chain/' + taskId);
  const c = document.getElementById('content');
  const steps = chain.tasks.map(t =>
    `<div style="margin:4px 0"><b>第${t.step}步</b> ${t.name || t.type} · ${t.status} · <code>${t.task_id}</code>
     ${t.output_path ? `<div style="font-size:11px;color:var(--muted)">${t.output_path}</div>` : ''}</div>`)
    .join('<div style="color:var(--accent)">↓ 派生 ↓</div>');
  c.insertAdjacentHTML('afterbegin',
    `<div class="card" style="padding:14px;margin-bottom:14px"><b>处理链 ${chain.pipeline_id}</b>（${chain.count} 步）${steps}</div>`);
}

async function loadDocs() {
  const docs = await api('/tool-docs');
  document.getElementById('viewTitle').textContent = '工具说明';
  const c = document.getElementById('content');
  c.innerHTML = '<div class="doc">' + docs.map(tool => `
    <h3>${tool.name} <code>${tool.id}</code></h3>
    ${tool.functions.map(fn => `
      <p>${(fn.description || '').replace(/\n/g, '<br>')}</p>
      ${fn.parameters.length ? `<table><tr><th>参数</th><th>类型</th><th>默认</th><th>说明</th></tr>
        ${fn.parameters.map(p => `<tr><td><code>${p.name}</code></td><td>${p.type}</td>
        <td>${p.default ?? '—'}</td><td>${p.description || ''}</td></tr>`).join('')}</table>`
        : '<p><i>无参数</i></p>'}`).join('')}
  </div>`).join('');
}

function goBack() {
  if (history.length > 1) history.back();
  else location.href = '/';
}

function fmt(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + 'M' : n > 1024 ? (n / 1024).toFixed(0) + 'K' : n + 'B'; }
const _params = new URLSearchParams(location.search);
switchView(_params.get('docs') === '1' ? 'docs' : 'media');
</script>
</body>
</html>
